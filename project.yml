name: LifeApp
options:
  bundleIdPrefix: flamio
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  LifeApp:
    type: application
    platform: iOS
    sources: [App, Shared]
    dependencies:
      - target: LifeWidget
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Flamio
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    entitlements:
      path: App/App.entitlements
      properties:
        com.apple.security.application-groups: [group.flamio.ios.ipa]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: flamio.ios.ipa
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
  LifeWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Flamio
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/Widget.entitlements
      properties:
        com.apple.security.application-groups: [group.flamio.ios.ipa]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: flamio.ios.ipa.widget
        TARGETED_DEVICE_FAMILY: "1"
